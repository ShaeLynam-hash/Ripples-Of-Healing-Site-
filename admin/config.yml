backend:
  name: git-gateway
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: "schedule"
    label: "Class Schedule"
    files:
      - label: "Weekly Schedule"
        name: "classes"
        file: "_data/classes.json"
        fields:
          - label: "Classes"
            name: "classes"
            widget: "list"
            fields:
              - label: "Day"
                name: "day"
                widget: "select"
                options: ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
              - label: "Time"
                name: "time"
                widget: "string"
                hint: "e.g. 9:00 AM"
              - label: "Class Name"
                name: "name"
                widget: "string"
              - label: "Instructor"
                name: "instructor"
                widget: "string"
              - label: "Duration"
                name: "duration"
                widget: "string"
                default: "60 min"
              - label: "Category"
                name: "cat"
                widget: "select"
                options:
                  - label: "Yoga"
                    value: "yoga"
                  - label: "Healing Movement"
                    value: "healing"
                  - label: "Meditation & Rest"
                    value: "meditation"
              - label: "Description"
                name: "desc"
                widget: "text"

  - name: "faq"
    label: "FAQ"
    files:
      - label: "FAQ Items"
        name: "faqs"
        file: "_data/faq.json"
        fields:
          - label: "FAQ Items"
            name: "faqs"
            widget: "list"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - label: "Getting Started"
                    value: "getting-started"
                  - label: "Billing"
                    value: "billing"
                  - label: "Technical"
                    value: "technical"
              - label: "Question"
                name: "question"
                widget: "string"
              - label: "Answer"
                name: "answer"
                widget: "text"

  - name: "instructors"
    label: "Instructors"
    files:
      - label: "Instructor Profiles"
        name: "instructors"
        file: "_data/instructors.json"
        fields:
          - label: "Instructors"
            name: "instructors"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Title / Role"
                name: "title"
                widget: "string"
                required: false
              - label: "Bio"
                name: "bio"
                widget: "text"
              - label: "Photo"
                name: "photo"
                widget: "image"
              - label: "Instagram URL"
                name: "instagram"
                widget: "string"

  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Text"
        name: "homepage"
        file: "_data/homepage.json"
        fields:
          - label: "Story Headline"
            name: "headline"
            widget: "string"
          - label: "Story Paragraph"
            name: "story_paragraph"
            widget: "text"
          - label: "Charity Tagline"
            name: "charity_tagline"
            widget: "text"
