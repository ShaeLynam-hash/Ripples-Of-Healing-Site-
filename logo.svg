<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 290" width="280" height="290" role="img" aria-label="Ripples of Healing">
  <title>Ripples of Healing</title>
  <defs>
    <clipPath id="circleClip">
      <circle cx="140" cy="140" r="138"/>
    </clipPath>
    <!-- Clip waves to their outline shapes -->
    <clipPath id="waveTopClip">
      <path d="M 52,185 C 70,160 95,148 140,158 C 185,148 210,160 228,185 C 215,195 185,200 140,198 C 95,200 65,195 52,185 Z"/>
    </clipPath>
    <clipPath id="waveMidClip">
      <path d="M 48,200 C 65,178 92,167 140,175 C 188,167 215,178 232,200 C 218,212 188,218 140,216 C 92,218 62,212 48,200 Z"/>
    </clipPath>
    <clipPath id="waveBotClip">
      <path d="M 44,216 C 62,196 90,185 140,192 C 190,185 218,196 236,216 C 222,232 192,238 140,236 C 88,238 58,232 44,216 Z"/>
    </clipPath>
  </defs>

  <!-- Light blue background circle -->
  <circle cx="140" cy="140" r="138" fill="#EAF4F7"/>

  <g clip-path="url(#circleClip)">

    <!-- ── Golden sunrise arcs ─────────────────────────────────────── -->
    <!-- Center sun dot -->
    <circle cx="140" cy="164" r="9" fill="#F9C215" stroke="#F0A020" stroke-width="1.5"/>
    <!-- Semicircular arcs — upper half only -->
    <path d="M 122,164 A 18,18 0 0 1 158,164"  fill="none" stroke="#F9C215" stroke-width="3"   stroke-linecap="round"/>
    <path d="M 108,164 A 32,32 0 0 1 172,164"  fill="none" stroke="#F9C215" stroke-width="3"   stroke-linecap="round"/>
    <path d="M 93,164  A 47,47 0 0 1 187,164"  fill="none" stroke="#F9C215" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 78,164  A 62,62 0 0 1 202,164"  fill="none" stroke="#F9C215" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 63,164  A 77,77 0 0 1 217,164"  fill="none" stroke="#F9C215" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 48,164  A 92,92 0 0 1 232,164"  fill="none" stroke="#F9C215" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 33,164  A 107,107 0 0 1 247,164" fill="none" stroke="#F9C215" stroke-width="2"   stroke-linecap="round"/>
    <path d="M 18,164  A 122,122 0 0 1 262,164" fill="none" stroke="#F9C215" stroke-width="1.8" stroke-linecap="round"/>

    <!-- ── Teal wave outlines (filled background shapes) ──────────── -->
    <!-- Top wave fill -->
    <path d="M 52,185 C 70,160 95,148 140,158 C 185,148 210,160 228,185 C 215,195 185,200 140,198 C 95,200 65,195 52,185 Z"
          fill="#EAF4F7" stroke="#4E9CA4" stroke-width="2.2"/>
    <!-- Mid wave fill -->
    <path d="M 48,200 C 65,178 92,167 140,175 C 188,167 215,178 232,200 C 218,212 188,218 140,216 C 92,218 62,212 48,200 Z"
          fill="#EAF4F7" stroke="#4E9CA4" stroke-width="2.2"/>
    <!-- Bottom wave fill -->
    <path d="M 44,216 C 62,196 90,185 140,192 C 190,185 218,196 236,216 C 222,232 192,238 140,236 C 88,238 58,232 44,216 Z"
          fill="#EAF4F7" stroke="#4E9CA4" stroke-width="2.2"/>

    <!-- ── Wave stripes — top wave (4 inner lines) ─────────────────── -->
    <g clip-path="url(#waveTopClip)" fill="none" stroke="#4E9CA4" stroke-width="2" stroke-linecap="round">
      <path d="M 68,179 C 85,165 108,158 140,164 C 172,158 195,165 212,179"/>
      <path d="M 63,186 C 82,171 106,164 140,170 C 174,164 198,171 217,186"/>
      <path d="M 58,193 C 78,177 103,170 140,176 C 177,170 202,177 222,193"/>
      <path d="M 54,199 C 75,183 100,176 140,182 C 180,176 205,183 226,199"/>
    </g>

    <!-- ── Wave stripes — mid wave ──────────────────────────────────── -->
    <g clip-path="url(#waveMidClip)" fill="none" stroke="#4E9CA4" stroke-width="2" stroke-linecap="round">
      <path d="M 64,195 C 82,180 106,172 140,178 C 174,172 198,180 216,195"/>
      <path d="M 59,203 C 78,187 103,179 140,185 C 177,179 202,187 221,203"/>
      <path d="M 54,210 C 74,194 100,186 140,192 C 180,186 206,194 226,210"/>
      <path d="M 50,217 C 71,200 97,193 140,199 C 183,193 209,200 230,217"/>
    </g>

    <!-- ── Wave stripes — bottom wave ──────────────────────────────── -->
    <g clip-path="url(#waveBotClip)" fill="none" stroke="#4E9CA4" stroke-width="2" stroke-linecap="round">
      <path d="M 60,212 C 79,196 104,188 140,194 C 176,188 201,196 220,212"/>
      <path d="M 55,220 C 75,203 101,195 140,201 C 179,195 205,203 225,220"/>
      <path d="M 51,228 C 72,210 98,203 140,209 C 182,203 208,210 229,228"/>
      <path d="M 47,235 C 69,218 96,210 140,216 C 184,210 211,218 233,235"/>
    </g>

    <!-- ── Text ──────────────────────────────────────────────────────── -->
    <text x="140" y="258"
          font-family="Georgia, 'Palatino Linotype', serif"
          font-size="34"
          font-weight="700"
          fill="#1E4B76"
          text-anchor="middle"
          letter-spacing="2">RIPPLES</text>

    <text x="140" y="278"
          font-family="Georgia, 'Palatino Linotype', serif"
          font-size="15"
          font-weight="500"
          fill="#4E9CA4"
          text-anchor="middle"
          letter-spacing="4">OF HEALING</text>

  </g>
</svg>
